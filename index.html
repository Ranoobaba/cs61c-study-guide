<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CS61C Midterm Cram</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <style>
      :root {
        --pl-blue: #3470f0;
        --pl-blue-dark: #2457c5;
        --page-bg: #f4f6f9;
        --ink: #1f2933;
        --muted: #5b6673;
        --good: #198754;
        --bad: #c0392b;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        background: var(--page-bg);
        color: var(--ink);
      }
      body {
        font-size: 1rem;
        line-height: 1.55;
        overflow-x: hidden;
      }
      :where(.d-flex, .row, .grid) > * {
        min-width: 0;
      }
      :where(p, li, td, th, h1, h2, h3, h4, h5) {
        overflow-wrap: anywhere;
      }
      :where(img, svg, canvas) {
        max-width: 100%;
        height: auto;
      }

      .topbar {
        background: #fff;
        border-bottom: 1px solid #dde2ea;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .topbar .brand {
        font-weight: 700;
        letter-spacing: 0.2px;
        color: var(--ink);
        text-decoration: none;
        white-space: nowrap;
      }
      .topbar .nav-link {
        padding: 0.35rem 0.6rem;
        border-radius: 0.4rem;
        color: var(--muted);
        font-weight: 500;
      }
      .topbar .nav-link.active {
        background: #e8efff;
        color: var(--pl-blue-dark);
      }
      .wrap {
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 16px;
      }

      .pl-card {
        border: 1px solid #d5dbe5;
        border-radius: 0.5rem;
        overflow: hidden;
        background: #fff;
        margin-bottom: 1.5rem;
      }
      .pl-card > .pl-header {
        background: var(--pl-blue);
        color: #fff;
        padding: 0.7rem 1rem;
        font-size: 1.05rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .pl-card > .pl-header .badge {
        font-weight: 600;
      }
      .pl-card > .pl-body {
        padding: 1rem 1.1rem;
      }
      .pl-card > .pl-footer {
        background: #f7f8fa;
        border-top: 1px solid #e3e7ee;
        padding: 0.7rem 1rem;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .btn-pl {
        background: var(--pl-blue);
        border-color: var(--pl-blue);
        color: #fff;
      }
      .btn-pl:hover {
        background: var(--pl-blue-dark);
        border-color: var(--pl-blue-dark);
        color: #fff;
      }
      .btn-pl-light {
        background: #5bc0eb;
        border-color: #5bc0eb;
        color: #10212e;
      }
      .btn-pl-light:hover {
        background: #46b2df;
        border-color: #46b2df;
        color: #10212e;
      }

      .dd-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 260px);
        gap: 0.6rem 1rem;
        align-items: center;
        padding: 0.45rem 0;
        border-bottom: 1px dashed #e6e9ef;
      }
      .dd-row:last-child {
        border-bottom: 0;
      }
      @media (max-width: 576px) {
        .dd-row {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .mark-good {
        outline: 2px solid var(--good) !important;
        outline-offset: 1px;
      }
      .mark-bad {
        outline: 2px solid var(--bad) !important;
        outline-offset: 1px;
      }
      .opt-row {
        display: flex;
        gap: 0.6rem;
        align-items: flex-start;
        padding: 0.45rem 0.6rem;
        border-radius: 0.4rem;
        border: 1px solid transparent;
      }
      .opt-row:hover {
        background: #f4f7fd;
      }
      .opt-row.good {
        border-color: var(--good);
        background: #eef8f2;
      }
      .opt-row.bad {
        border-color: var(--bad);
        background: #fdf0ee;
      }
      .opt-row input {
        margin-top: 0.35rem;
        flex: none;
      }

      .code-host {
        margin: 0.75rem 0 1rem;
        border: 1px solid #e1e5ec;
        border-radius: 0.45rem;
        overflow: hidden;
        background: #fff;
      }
      .code-fallback {
        margin: 0;
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
        background: #f8f9fb;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .lesson-body pre {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .lesson-body code,
      .pl-body code {
        color: #b3245a;
      }
      .lesson-body pre code,
      .code-fallback code {
        color: inherit;
      }
      .lesson-body table {
        width: 100%;
      }
      .lesson-section {
        background: #fff;
        border: 1px solid #dde2ea;
        border-radius: 0.5rem;
        padding: 1rem 1.15rem;
        margin-bottom: 1.1rem;
      }
      .lesson-section h3 {
        font-size: 1.15rem;
        margin-bottom: 0.6rem;
      }

      .steps-box {
        background: #f6f8ff;
        border: 1px solid #d5defa;
        border-radius: 0.45rem;
        padding: 0.85rem 1rem;
        margin-top: 1rem;
      }
      .feedback-box {
        margin-top: 1rem;
      }
      .progress {
        height: 0.55rem;
      }
      .path-item {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        padding: 0.6rem 0.2rem;
        border-bottom: 1px solid #edf0f4;
      }
      .path-item:last-child {
        border-bottom: 0;
      }
      .path-item .flex-grow-1 {
        min-width: 0;
      }
      .path-item.done .path-title {
        text-decoration: line-through;
        color: var(--muted);
      }
      .section-pill {
        font-size: 0.75rem;
      }
      .timer {
        position: sticky;
        top: 56px;
        z-index: 15;
        background: #fff7e6;
        border: 1px solid #f0d9a8;
        border-radius: 0.5rem;
        padding: 0.5rem 0.9rem;
        display: flex;
        gap: 1rem;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .timer .clock {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: 1.25rem;
      }
      .kbd {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #1f2933;
        color: #f4f6f9;
        padding: 0.1rem 0.4rem;
        border-radius: 0.3rem;
        font-size: 0.88em;
      }
      .muted {
        color: var(--muted);
      }
      .stat-num {
        font-size: 1.6rem;
        font-weight: 700;
        line-height: 1.1;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="wrap d-flex align-items-center gap-3 py-2 flex-wrap">
        <a class="brand" href="#/home">CS61C Midterm Part I</a>
        <nav class="d-flex gap-1 flex-wrap" id="nav"></nav>
      </div>
    </header>
    <main class="wrap py-4" id="app">
      <div class="text-center muted py-5">Loading...</div>
    </main>

    <script>
      // Resolved by the module script below once the code renderer has loaded, or after a timeout.
      window.__codeReady = new Promise(function (resolve) {
        window.__resolveCodeReady = resolve;
        setTimeout(resolve, 4000);
      });
    </script>
    <script src="content.js"></script>
    <script src="sds.js"></script>
    <script src="sds-lessons.js"></script>
    <script src="app.js"></script>
    <script type="module">
      try {
        const mod = await import("https://esm.sh/@pierre/diffs@1.2.10?bundle");
        window.PierreFile = mod.File;
      } catch (err) {
        console.warn("Code renderer failed to load, using plain blocks", err);
      }
      window.__resolveCodeReady();
    </script>
  </body>
</html>
