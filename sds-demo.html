<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDS Drill Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #f4f6f9; }
    .q-card .card-header { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: space-between; }
    .lesson-demo { background: var(--bs-body-bg); border: 1px dashed var(--bs-border-color); border-radius: .5rem; padding: .75rem; margin: .5rem 0 1rem; }
    .toc a { text-decoration: none; }
    section { scroll-margin-top: 70px; }
  </style>
</head>
<body>
  <nav class="navbar sticky-top bg-dark" data-bs-theme="dark">
    <div class="container-fluid" style="max-width: 980px">
      <span class="navbar-brand mb-0 h1">SDS drill demo</span>
      <div class="d-flex gap-2 align-items-center">
        <label for="seed" class="text-light small mb-0">seed</label>
        <input id="seed" class="form-control form-control-sm" style="width: 7.5rem" type="number" value="1">
        <button id="reroll" class="btn btn-sm btn-outline-light" type="button">New seed</button>
      </div>
    </div>
  </nav>

  <main class="container py-3" style="max-width: 980px">
    <p class="text-body-secondary small mb-2">Test page for <code>sds.js</code> and <code>sds-lessons.js</code>: one question of every kind at both difficulties, the three practice exam questions, and every lesson.</p>
    <div class="toc small mb-3">
      Jump to:
      <a href="#practice">Practice exam</a> &middot;
      <a href="#fsm">FSM</a> &middot;
      <a href="#timing">Timing</a> &middot;
      <a href="#bool">Boolean</a> &middot;
      <a href="#lessons">Lessons</a>
    </div>

    <section id="practice"><h2 class="h4 mt-2">Practice exam (PM1.4 to PM1.6)</h2><div id="practice-list"></div></section>
    <section id="fsm"><h2 class="h4 mt-4">FSM</h2><div id="fsm-list"></div></section>
    <section id="timing"><h2 class="h4 mt-4">Timing</h2><div id="timing-list"></div></section>
    <section id="bool"><h2 class="h4 mt-4">Boolean algebra</h2><div id="bool-list"></div></section>
    <section id="lessons"><h2 class="h4 mt-4">Lessons</h2><div id="lesson-list"></div></section>
  </main>

  <script src="sds.js"></script>
  <script src="sds-lessons.js"></script>
  <script>
    (function () {
      'use strict';

      function card(q, host) {
        const el = document.createElement('div');
        el.className = 'card q-card mb-3 shadow-sm';
        el.innerHTML =
          '<div class="card-header"><strong></strong><span><span class="badge text-bg-secondary me-1 diff"></span><code class="small qid"></code></span></div>' +
          '<div class="card-body"><div class="qbody"></div>' +
          '<div class="d-flex gap-2 mt-3"><button class="btn btn-primary btn-sm" data-act="grade" type="button">Grade</button>' +
          '<button class="btn btn-outline-secondary btn-sm" data-act="sol" type="button">Show solution</button></div>' +
          '<div class="feedback mt-3"></div><div class="solution mt-3 border-top pt-3" hidden></div></div>';
        el.querySelector('strong').textContent = q.title;
        el.querySelector('.diff').textContent = q.difficulty;
        el.querySelector('.qid').textContent = q.id;
        host.appendChild(el);
        q.render(el.querySelector('.qbody'));
        el.querySelector('[data-act="grade"]').addEventListener('click', function () {
          const r = q.grade();
          el.querySelector('.feedback').innerHTML = r.feedbackHtml + '<div class="small text-body-secondary mt-1">score ' + r.score.toFixed(2) + '</div>';
        });
        el.querySelector('[data-act="sol"]').addEventListener('click', function (ev) {
          const box = el.querySelector('.solution');
          if (box.hidden) { box.innerHTML = q.solutionHtml(); box.hidden = false; ev.target.textContent = 'Hide solution'; }
          else { box.hidden = true; ev.target.textContent = 'Show solution'; }
        });
        return el;
      }

      function renderAll(seed) {
        const practice = document.getElementById('practice-list');
        practice.innerHTML = '';
        [4, 5, 6].forEach(function (n) { card(SDS.practiceQuestion(n), practice); });
        Object.keys(SDS.KINDS).forEach(function (topic) {
          const host = document.getElementById(topic + '-list');
          host.innerHTML = '';
          SDS.KINDS[topic].forEach(function (kind) {
            ['core', 'exam+'].forEach(function (difficulty) {
              try {
                card(SDS.makeQuestion(topic, { kind: kind, difficulty: difficulty, seed: seed }), host);
              } catch (e) {
                const err = document.createElement('div');
                err.className = 'alert alert-danger';
                err.textContent = topic + '/' + kind + '/' + difficulty + ': ' + e.message;
                host.appendChild(err);
              }
            });
          });
        });
      }

      function renderLessons() {
        const host = document.getElementById('lesson-list');
        host.innerHTML = '';
        const L = window.SDS_LESSONS || {};
        const names = { fsm: 'Finite state machines', timing: 'Register timing', bool: 'Boolean algebra' };
        Object.keys(names).forEach(function (topic) {
          const sec = document.createElement('div');
          sec.className = 'card mb-4 shadow-sm';
          sec.innerHTML = '<div class="card-header"><strong>' + names[topic] + '</strong></div><div class="card-body"></div>';
          const body = sec.querySelector('.card-body');
          (L[topic] || []).forEach(function (s, i) {
            const part = document.createElement('div');
            part.className = 'mb-4';
            part.innerHTML = '<h3 class="h5">' + (i + 1) + '. ' + s.title + '</h3>' + s.html;
            body.appendChild(part);
            if (typeof s.demo === 'function') {
              const d = document.createElement('div');
              d.className = 'lesson-demo';
              part.appendChild(d);
              try { s.demo(d); } catch (e) { d.textContent = 'demo error: ' + e.message; }
            }
          });
          host.appendChild(sec);
        });
      }

      const seedEl = document.getElementById('seed');
      const params = new URLSearchParams(location.search);
      if (params.get('seed')) seedEl.value = params.get('seed');
      seedEl.addEventListener('change', function () { renderAll(Number(seedEl.value) || 0); });
      document.getElementById('reroll').addEventListener('click', function () {
        seedEl.value = Math.floor(Math.random() * 100000);
        renderAll(Number(seedEl.value));
      });
      renderAll(Number(seedEl.value) || 0);
      renderLessons();
    })();
  </script>
</body>
</html>
